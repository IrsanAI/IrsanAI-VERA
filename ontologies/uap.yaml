# ============================================================
# IrsanAI-VERA Domain Ontology: UAP / Disclosure
# ============================================================
# Swap this file to change the entire system's investigative domain.
# All other components (agents, Bayesian core, graph) run identically.
# ============================================================

meta:
  domain: "UAP Disclosure"
  version: "1.0"
  description: >
    Investigation into whether governments, military organizations, and
    intelligence services systematically conceal evidence of non-human
    intelligence or advanced non-human technology.
  author: "IrsanAI"
  created: "2026-04-14"

# ---- Bayesian Prior ----------------------------------------
# Starting probability BEFORE any evidence is collected.
# Keep this LOW. Evidence must earn every percentage point.
bayesian:
  prior_tech_coverup: 0.10      # 10% prior: technology concealment
  prior_et_presence: 0.05       # 5% prior: actual ET life concealment
  min_evidence_for_update: 3    # Minimum evidence pieces before updating
  confidence_decay_days: 90     # Evidence older than this loses weight

# ---- Key Entities ------------------------------------------
# Nodes in the knowledge graph. The system tracks relationships between these.
entities:
  organizations:
    - name: "AARO"
      full_name: "All-domain Anomaly Resolution Office"
      trust_weight: 0.75  # Semi-official — somewhat trustworthy source
    - name: "Pentagon"
      full_name: "US Department of Defense"
      trust_weight: 0.70
    - name: "CIA"
      trust_weight: 0.50  # High classification = high redaction = lower signal
    - name: "DIA"
      full_name: "Defense Intelligence Agency"
      trust_weight: 0.55
    - name: "NASA"
      trust_weight: 0.80
    - name: "Congress"
      trust_weight: 0.65

  document_types:
    - type: "FOIA_release"
      trust_weight: 0.85    # Official, but potentially redacted
    - type: "whistleblower_testimony"
      trust_weight: 0.40    # Significant, but unverifiable
    - type: "government_report"
      trust_weight: 0.80
    - type: "academic_paper"
      trust_weight: 0.75
    - type: "news_article"
      trust_weight: 0.30    # Low trust — requires corroboration
    - type: "social_media"
      trust_weight: 0.05    # Near-zero trust without corroboration

# ---- Semantic Keywords --------------------------------------
# Used by the NLP Signal Agent for semantic similarity search.
# These are not keyword matches — they seed the sentence-transformer embeddings.
semantic_seeds:
  high_signal:
    - "special access program"
    - "unacknowledged SAP"
    - "non-human intelligence"
    - "non-human biologics"
    - "crash retrieval program"
    - "controlled disclosure"
  medium_signal:
    - "classified UAP data"
    - "redacted anomaly report"
    - "black budget aerospace"
    - "sensor data suppression"
    - "FOIA exemption b1 b3"
  low_signal:
    - "UFO sighting report"
    - "UAP incident"
    - "unidentified aerial phenomena"
    - "pilot testimony"

# ---- Data Sources ------------------------------------------
# Where each agent should look. Add/remove to change the information space.
sources:
  github:
    queries:
      - "UFO disclosure archive"
      - "UAP unidentified aerial phenomena"
      - "FOIA declassified documents"
      - "UAP data analysis"
      - "government UFO investigation"
    max_results: 20
    min_stars: 0

  huggingface:
    queries:
      - "FOIA documents"
      - "government disclosure dataset"
      - "UAP anomaly"
    max_results: 10

  rss_feeds:
    - name: "The Black Vault"
      url: "https://www.theblackvault.com/documentarchive/feed/"
      trust_weight: 0.45
    - name: "FOIA.gov"
      url: "https://www.foia.gov/news.html"
      trust_weight: 0.90

# ---- Red Team Configuration --------------------------------
# The adversarial agent actively seeks counter-evidence for these claims.
red_team:
  counter_hypotheses:
    - "All UAP sightings have conventional explanations (atmospheric, technical)"
    - "Whistleblower claims are financially or ideologically motivated"
    - "Budget anomalies reflect known classified conventional programs"
    - "FOIA redactions protect sources/methods, not ET evidence"
  counter_sources:
    - "Skeptical Inquirer"
    - "SETI Institute official statements"
    - "Congressional Budget Office reports"

# ---- Obsidian Export Configuration -------------------------
obsidian:
  vault_structure:
    - "entities/"      # One note per tracked entity
    - "evidence/"      # One note per evidence piece
    - "sessions/"      # One note per investigation cycle
    - "claims/"        # One note per active claim
  link_threshold: 0.3  # Minimum connection strength for a wiki-link
  tags:
    - "#vera"
    - "#uap"
    - "#investigation"

# ---- Verdict Thresholds ------------------------------------
# What probability level triggers what verdict label.
verdict_thresholds:
  - max: 0.20
    label: "No significant evidence"
    color: "green"
  - max: 0.40
    label: "Weak signal — monitoring"
    color: "yellow"
  - max: 0.60
    label: "Moderate evidence — investigation ongoing"
    color: "orange"
  - max: 0.80
    label: "Strong evidence — high confidence in hypothesis"
    color: "red"
  - max: 1.00
    label: "Conclusive — peer review recommended"
    color: "darkred"
